# 只收集 tests/ 下的测试文件。
#
# 注意：pytest 收集前会先导入仓库根目录的 __init__.py（插件入口），它需要宿主
# SDK（plugin.sdk）。独立仓库不带宿主，所以跑测试前要把宿主 SDK 放进 PYTHONPATH：
#
#   $env:PYTHONPATH = "<N.E.K.O 仓库根 或 宿主 SDK 目录>"
#   python -m pytest -q
#
# 这与 workspace 里 plugin_database / plugin_knowledge_base 的约定一致。
[pytest]
testpaths = tests
python_files = test_*.py
# 把插件根目录加进 sys.path，测试里就能直接 import openviking_client。
# 不用在测试文件里手写 sys.path 拼接——那样会触发 ruff E402，而官方 CI
# 用 --ignore-noqa 跑 ruff，抑制注释会被无视。
pythonpath = .
